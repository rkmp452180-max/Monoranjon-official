<!DOCTYPE html>
<html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="theme-color" content="#0f172a"><title>Payment - Monoranjon Official</title><style>*{box-sizing:border-box}body{font-family:Arial;background:#f5f7fb;color:#111827;margin:0}.header{position:sticky;top:0;background:#fff;border-bottom:1px solid #e5e7eb}.nav{max-width:900px;margin:auto;height:66px;padding:0 16px;display:flex;align-items:center;gap:12px}.back{border:0;background:#f1f5f9;width:40px;height:40px;border-radius:50%;font-size:18px}.logo{font-size:20px;font-weight:900;text-decoration:none;color:#111}.logo span{color:#2563eb}.container{max-width:900px;margin:25px auto;padding:0 16px 70px}.box{background:#fff;border:1px solid #e5e7eb;border-radius:20px;padding:22px;margin-bottom:16px}.muted{color:#64748b;font-size:14px}.product{display:flex;gap:16px;align-items:center}.product-icon{width:100px;height:100px;border-radius:16px;background:linear-gradient(135deg,#dbeafe,#eef2ff);display:flex;align-items:center;justify-content:center;font-size:48px}.price{font-size:27px;font-weight:900;margin-top:8px}.methods{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:15px}.method{border:2px solid #e5e7eb;background:#fff;border-radius:13px;padding:14px;font-weight:700}.method.active{border-color:#2563eb;background:#eff6ff;color:#1d4ed8}.form{display:grid;gap:11px;margin-top:15px}.form label{font-weight:700;font-size:14px}.form input,.form textarea{width:100%;border:1px solid #dbe3ec;border-radius:10px;padding:11px}.form textarea{min-height:80px}.pay-info{margin-top:15px;padding:15px;border-radius:13px;background:#eff6ff;color:#1e3a8a}.number{font-size:22px;font-weight:900;margin:5px 0}.copy,.submit{border:0;background:#2563eb;color:#fff;padding:10px 14px;border-radius:9px;font-weight:700}.submit{width:100%;padding:14px;font-size:16px}.submit:disabled{opacity:.6}.error,.success{padding:14px;border-radius:10px;margin-top:12px;display:none}.error{background:#fee2e2;color:#991b1b}.success{background:#dcfce7;color:#166534}@media(max-width:650px){.methods{grid-template-columns:1fr}.product-icon{width:78px;height:78px;font-size:38px}}</style></head><body><header class="header"><div class="nav"><button class="back" onclick="history.back()">←</button><a class="logo" href="index.html">Monoranjon <span>Official</span></a></div></header><main class="container"><section class="box"><h2>💳 Secure Payment</h2><p class="muted">Order information পূরণ করে Payment Submit করুন।</p></section><section class="box"><div class="product"><div class="product-icon" id="productIcon">📦</div><div><h2 id="productName">Product</h2><p class="muted" id="productCategory">Digital Product</p><div class="price" id="productPrice">৳0</div></div></div></section><section class="box"><h2>1. Payment Method</h2><div class="methods"><button class="method active" data-method="bKash">bKash</button><button class="method" data-method="Nagad">Nagad</button><button class="method" data-method="Rocket">Rocket</button></div><div class="pay-info"><div>Payment Number</div><div class="number">01893109600</div><button class="copy" onclick="copyNumber()">📋 Copy Number</button><p class="muted">Payment করার পর Transaction ID দিন।</p></div></section><section class="box"><h2>2. Customer Information</h2><div class="form"><label>আপনার নাম</label><input id="customerName" placeholder="আপনার নাম"><label>Phone Number</label><input id="phone" type="tel" placeholder="01XXXXXXXXX"><label>Address</label><textarea id="address" placeholder="আপনার ঠিকানা"></textarea><label>Transaction ID</label><input id="transactionId" placeholder="Payment Transaction ID"><button id="submitBtn" class="submit" onclick="submitOrder()">✅ Confirm Order</button></div><div id="error" class="error"></div><div id="success" class="success"></div></section></main><script type="module">import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";import{getAuth,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";import{getFirestore,collection,addDoc,serverTimestamp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";const firebaseConfig={apiKey:"AIzaSyCkjYc5E2p69LsOasqmJSAm90KKjkjLKPw",authDomain:"monoranjon-pay.firebaseapp.com",databaseURL:"https://monoranjon-pay-default-rtdb.firebaseio.com",projectId:"monoranjon-pay",storageBucket:"monoranjon-pay.firebasestorage.app",messagingSenderId:"618952154005",appId:"1:618952154005:web:e26b8375af4c06c45b349c"};const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);let currentUser=null,selectedMethod="bKash";const product=JSON.parse(localStorage.getItem("monoranjon_selected_product")||"null");if(product){productIcon.textContent=product.emoji||"📦";productName.textContent=product.name||"Product";productCategory.textContent=product.category||"Digital Product";productPrice.textContent="৳"+Number(product.price||0).toLocaleString("en-BD")}else{productName.textContent="কোনো Product নির্বাচন করা হয়নি";submitBtn.disabled=true}onAuthStateChanged(auth,u=>{currentUser=u;if(u)customerName.value=u.displayName||""});document.querySelectorAll(".method").forEach(b=>b.onclick=()=>{document.querySelectorAll(".method").forEach(x=>x.classList.remove("active"));b.classList.add("active");selectedMethod=b.dataset.method});window.copyNumber=async()=>{try{await navigator.clipboard.writeText("01893109600");showSuccess("📋 Payment number copy হয়েছে।")}catch(e){showError("Number: 01893109600")}};window.submitOrder=async()=>{hide();if(!currentUser)return showError("আগে Login করুন।");if(!product)return showError("Product নির্বাচন করা হয়নি।");const n=customerName.value.trim(),p=phone.value.trim(),a=address.value.trim(),t=transactionId.value.trim();if(!n||!p||!a||!t)return showError("সব তথ্য পূরণ করুন।");submitBtn.disabled=true;submitBtn.textContent="⏳ Order Submit হচ্ছে...";const orderId="ORD-"+Date.now();try{await addDoc(collection(db,"payments"),{orderId,userId:currentUser.uid,userEmail:currentUser.email||"",userName:currentUser.displayName||n,customerName:n,phone:p,address:a,productId:product.id||"",productName:product.name||"",amount:Number(product.price||0),method:selectedMethod,transactionId:t,status:"pending",paymentStatus:"pending",createdAtClient:new Date().toISOString(),createdAt:serverTimestamp()});localStorage.removeItem("monoranjon_selected_product");let cart=JSON.parse(localStorage.getItem("monoranjon_cart")||"[]");localStorage.setItem("monoranjon_cart",JSON.stringify(cart.filter(x=>x.id!==product.id)));showSuccess("✅ Order সফল হয়েছে! Order ID: "+orderId);submitBtn.textContent="Order Submitted"}catch(e){console.error(e);showError("Order Submit করা যায়নি। Firebase rules/connection চেক করুন।");submitBtn.disabled=false;submitBtn.textContent="✅ Confirm Order"}};function showError(m){error.textContent=m;error.style.display="block";success.style.display="none"}function showSuccess(m){success.textContent=m;success.style.display="block";error.style.display="none"}function hide(){error.style.display="none";success.style.display="none"}</script></body></html>
