<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#0f172a">
<title>My Account - Monoranjon Official</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Arial,sans-serif;background:#f5f7fb;color:#111827;line-height:1.5}button,input{font:inherit}button{cursor:pointer}a{text-decoration:none;color:inherit}.header{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid #e5e7eb}.nav{max-width:1100px;height:66px;margin:auto;padding:0 16px;display:flex;align-items:center;gap:12px}.logo{font-size:20px;font-weight:900}.logo span{color:#2563eb}.back{border:0;background:#f1f5f9;width:40px;height:40px;border-radius:50%;font-size:18px}.container{max-width:1100px;margin:22px auto;padding:0 16px 60px}.profile,.menu,.panel{background:#fff;border:1px solid #e5e7eb;border-radius:20px}.cover{height:170px;background:linear-gradient(135deg,#0f172a,#2563eb,#4f46e5);border-radius:20px 20px 0 0}.profile-body{padding:0 22px 22px}.avatar{width:90px;height:90px;margin-top:-45px;border:5px solid #fff;border-radius:50%;background:#2563eb;color:#fff;display:flex;align-items:center;justify-content:center;font-size:35px;font-weight:900}.profile h1{margin-top:8px;font-size:24px}.email,.muted{color:#64748b;font-size:14px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.btn{border:0;border-radius:10px;padding:11px 16px;font-weight:700}.primary{background:#2563eb;color:#fff}.light{background:#f1f5f9}.grid{display:grid;grid-template-columns:230px 1fr;gap:18px;margin-top:18px}.menu{padding:10px}.menu button{width:100%;border:0;background:#fff;text-align:left;padding:12px;border-radius:10px;font-weight:700;color:#334155}.menu button:hover,.menu button.active{background:#eff6ff;color:#2563eb}.panel{padding:22px;min-height:390px}.panel h2{margin-bottom:5px}.notice{padding:14px;border-radius:12px;background:#eff6ff;color:#1d4ed8;margin:14px 0}.form{display:grid;gap:12px;max-width:600px;margin-top:18px}.form input{height:44px;border:1px solid #dbe3ec;border-radius:10px;padding:0 12px;outline:0}.form input:focus{border-color:#2563eb}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:18px}.card{border:1px solid #e5e7eb;border-radius:14px;padding:15px}.price{font-size:20px;font-weight:900;margin:7px 0}.badge{display:inline-block;padding:4px 8px;border-radius:8px;background:#fef3c7;color:#92400e;font-size:12px;font-weight:700}.empty{text-align:center;padding:50px 15px;color:#64748b}.toast{position:fixed;right:18px;bottom:20px;background:#111827;color:#fff;padding:12px 16px;border-radius:11px;display:none;z-index:50}.toast.show{display:block}@media(max-width:700px){.grid{grid-template-columns:1fr}.menu{display:grid;grid-template-columns:repeat(2,1fr);gap:5px}.menu button{font-size:13px}.cards{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="header"><div class="nav"><button class="back" onclick="location.href='index.html'">←</button><a class="logo" href="index.html">Monoranjon <span>Official</span></a></div></header>
<main class="container">
<section class="profile"><div class="cover"></div><div class="profile-body"><div class="avatar" id="avatar">G</div><h1 id="profileName">Guest Account</h1><div class="email" id="profileEmail">Login required</div><div class="actions"><button class="btn primary" onclick="showSection('profile')">Edit Profile</button><button class="btn light" onclick="showSection('orders')">My Orders</button><button class="btn light" onclick="showSection('cart')">🛒 Cart</button></div></div></section>
<div class="grid"><aside class="menu">
<button class="active" data-section="profile" onclick="showSection('profile')">👤 Profile</button><button data-section="orders" onclick="showSection('orders')">📦 My Orders</button><button data-section="products" onclick="showSection('products')">🛍️ My Products</button><button data-section="cart" onclick="showSection('cart')">🛒 Cart</button><button data-section="wishlist" onclick="showSection('wishlist')">❤️ Wishlist</button><button data-section="payments" onclick="showSection('payments')">💳 Payments</button><button data-section="notifications" onclick="showSection('notifications')">🔔 Notifications</button><button data-section="support" onclick="showSection('support')">💬 Support</button><button data-section="settings" onclick="showSection('settings')">⚙️ Settings</button><button onclick="logout()">🚪 Logout</button>
</aside><section class="panel" id="panel"></section></div></main><div id="toast" class="toast"></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getAuth,onAuthStateChanged,signOut,updateProfile,sendPasswordResetEmail}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import{getFirestore,collection,query,where,getDocs}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyCkjYc5E2p69LsOasqmJSAm90KKjkjLKPw",authDomain:"monoranjon-pay.firebaseapp.com",databaseURL:"https://monoranjon-pay-default-rtdb.firebaseio.com",projectId:"monoranjon-pay",storageBucket:"monoranjon-pay.firebasestorage.app",messagingSenderId:"618952154005",appId:"1:618952154005:web:e26b8375af4c06c45b349c"};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);let currentUser=null,orders=[];
onAuthStateChanged(auth,async u=>{currentUser=u;updateHeader();if(u)await loadOrders();showSection(location.hash.slice(1)||'profile')});
function updateHeader(){if(!currentUser){profileName.textContent='Guest Account';profileEmail.textContent='Login required';avatar.textContent='G';return}const n=currentUser.displayName||currentUser.email?.split('@')[0]||'User';profileName.textContent=n;profileEmail.textContent=currentUser.email||'';avatar.textContent=n[0].toUpperCase()}
async function loadOrders(){try{const s=await getDocs(query(collection(db,'payments'),where('userId','==',currentUser.uid)));orders=s.docs.map(d=>({id:d.id,...d.data()}));orders.sort((a,b)=>String(b.createdAtClient||'').localeCompare(String(a.createdAtClient||'')))}catch(e){orders=[]}}
window.showSection=s=>{document.querySelectorAll('[data-section]').forEach(b=>b.classList.toggle('active',b.dataset.section===s));({profile:profileSection,orders:ordersSection,products:productsSection,cart:cartSection,wishlist:wishlistSection,payments:paymentsSection,notifications:notificationsSection,support:supportSection,settings:settingsSection}[s]||profileSection)();history.replaceState(null,'','#'+s)};
function profileSection(){panel.innerHTML=currentUser?`<h2>👤 Profile</h2><p class="muted">আপনার account information পরিচালনা করুন।</p><div class="form"><input id="nameInput" placeholder="Your name" value="${esc(currentUser.displayName||'')}"><input value="${esc(currentUser.email||'')}" disabled><button class="btn primary" onclick="saveProfile()">Save Profile</button></div>`:`<h2>👤 Profile</h2><div class="notice">আপনার Account দেখতে Login করতে হবে।</div><button class="btn primary" onclick="location.href='index.html'">Back to Home</button>`}
window.saveProfile=async()=>{if(!currentUser)return;const n=nameInput.value.trim();if(!n)return toast('নাম লিখুন');try{await updateProfile(currentUser,{displayName:n});updateHeader();toast('✅ Profile updated')}catch(e){toast('Profile update করা যায়নি')}};
function ordersSection(){if(!currentUser)return panel.innerHTML=loginBox('My Orders');if(!orders.length)return panel.innerHTML='<h2>📦 My Orders</h2><div class="empty">এখনো কোনো Order নেই।</div>';panel.innerHTML='<h2>📦 My Orders</h2><div class="cards">'+orders.map(o=>`<div class="card"><strong>${esc(o.productName||'Product')}</strong><div class="price">৳${Number(o.amount||0).toLocaleString('en-BD')}</div><p class="muted">Payment: ${esc(o.method||'-')}</p><p>Transaction: ${esc(o.transactionId||'-')}</p><span class="badge">${esc(o.status||o.paymentStatus||'pending')}</span></div>`).join('')+'</div>'}
function productsSection(){panel.innerHTML='<h2>🛍️ My Products</h2><p class="muted">Seller Products এখানে ভবিষ্যতে দেখানো হবে।</p><div class="notice">Admin/Seller system যোগ করার পর Product manage করা যাবে।</div>'}
function cartSection(){const c=JSON.parse(localStorage.getItem('monoranjon_cart')||'[]');if(!c.length)return panel.innerHTML='<h2>🛒 Cart</h2><div class="empty">Cart খালি।<br><br><button class="btn primary" onclick="location.href=\'index.html#products\'">Products দেখুন</button></div>';panel.innerHTML='<h2>🛒 Cart</h2><div class="cards">'+c.map((p,i)=>`<div class="card"><div style="font-size:40px">${p.emoji||'📦'}</div><strong>${esc(p.name)}</strong><p class="muted">${esc(p.category||'')}</p><div class="price">৳${Number(p.price||0).toLocaleString('en-BD')}</div><p>Quantity: ${p.quantity||1}</p><button class="btn primary" onclick="buyCart(${i})">Buy Now</button> <button class="btn light" onclick="removeCart(${i})">Remove</button></div>`).join('')+'</div>'}
window.buyCart=i=>{const c=JSON.parse(localStorage.getItem('monoranjon_cart')||'[]');if(!c[i])return;localStorage.setItem('monoranjon_selected_product',JSON.stringify(c[i]));location.href='payment.html'};window.removeCart=i=>{const c=JSON.parse(localStorage.getItem('monoranjon_cart')||'[]');c.splice(i,1);localStorage.setItem('monoranjon_cart',JSON.stringify(c));cartSection();toast('Cart থেকে Remove হয়েছে')};
function wishlistSection(){const l=JSON.parse(localStorage.getItem('monoranjon_wishlist')||'[]');if(!l.length)return panel.innerHTML='<h2>❤️ Wishlist</h2><div class="empty">Wishlist এখনো খালি।</div>';panel.innerHTML='<h2>❤️ Wishlist</h2><div class="cards">'+l.map((p,i)=>`<div class="card"><div style="font-size:40px">${p.emoji||'❤️'}</div><strong>${esc(p.name)}</strong><div class="price">৳${Number(p.price||0).toLocaleString('en-BD')}</div><button class="btn primary" onclick="buyWish(${i})">Buy Now</button> <button class="btn light" onclick="removeWish(${i})">Remove</button></div>`).join('')+'</div>'}window.buyWish=i=>{const l=JSON.parse(localStorage.getItem('monoranjon_wishlist')||'[]');if(!l[i])return;localStorage.setItem('monoranjon_selected_product',JSON.stringify(l[i]));location.href='payment.html'};window.removeWish=i=>{const l=JSON.parse(localStorage.getItem('monoranjon_wishlist')||'[]');l.splice(i,1);localStorage.setItem('monoranjon_wishlist',JSON.stringify(l));wishlistSection()};
function paymentsSection(){panel.innerHTML='<h2>💳 Payments</h2><p class="muted">Payment ও Order history</p><div class="cards">'+(orders.length?orders.map(o=>`<div class="card"><strong>${esc(o.productName||'Product')}</strong><p>Amount: ৳${Number(o.amount||0).toLocaleString('en-BD')}</p><p>Method: ${esc(o.method||'-')}</p><p>Status: <span class="badge">${esc(o.paymentStatus||o.status||'pending')}</span></p></div>`).join(''):'<div class="empty">Payment history নেই।</div>')+'</div>'}function notificationsSection(){panel.innerHTML='<h2>🔔 Notifications</h2><div class="notice">এখনো কোনো নতুন notification নেই।</div>'}function supportSection(){panel.innerHTML='<h2>💬 Support</h2><p class="muted">যেকোনো সমস্যায় যোগাযোগ করুন।</p><div class="actions"><a class="btn primary" href="https://wa.me/8801845077415" target="_blank">WhatsApp</a><a class="btn light" href="https://www.facebook.com/profile.php?id=61591843483368" target="_blank">Facebook</a><a class="btn light" href="https://www.youtube.com/@official100bro" target="_blank">YouTube</a></div>'}function settingsSection(){panel.innerHTML='<h2>⚙️ Settings</h2><div class="notice">Account settings</div><button class="btn light" onclick="resetPassword()">🔐 Password Reset Email</button>'}
window.logout=async()=>{try{await signOut(auth);toast('Logout হয়েছে');setTimeout(()=>location.href='index.html',500)}catch(e){toast('Logout করা যায়নি')}};window.resetPassword=async()=>{if(!currentUser?.email)return toast('Email account পাওয়া যায়নি');try{await sendPasswordResetEmail(auth,currentUser.email);toast('Password reset email পাঠানো হয়েছে')}catch(e){toast('Password reset করা যায়নি')}};function loginBox(t){return `<h2>👤 ${t}</h2><div class="notice">আপনার Account দিয়ে Login করলে এই তথ্য দেখা যাবে।</div><button class="btn primary" onclick="location.href='index.html'">Back to Home</button>`}function toast(m){const e=document.getElementById('toast');e.textContent=m;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2500)}function esc(v){return String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;')}
</script></body></html>
