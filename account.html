<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Account - Monoranjon Official</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#172033}button,input{font:inherit}button{cursor:pointer;border:0}.top{height:64px;background:#fff;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;padding:0 18px;gap:14px;position:sticky;top:0;z-index:10}.logo{font-size:20px;font-weight:800;color:#1877f2}.back{background:#eef4ff;color:#1877f2;padding:9px 13px;border-radius:10px}.wrap{max-width:1050px;margin:28px auto;padding:0 16px}.auth,.profile{background:#fff;border-radius:18px;box-shadow:0 8px 30px #17203312;padding:24px}.auth{max-width:460px;margin:40px auto}.tabs{display:flex;background:#f1f5f9;border-radius:12px;padding:4px;margin:18px 0}.tabs button{flex:1;padding:11px;border-radius:9px;background:transparent;color:#64748b}.tabs button.active{background:#fff;color:#1877f2;font-weight:700;box-shadow:0 2px 8px #0000000d}.field{margin:12px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}.field input{width:100%;padding:12px;border:1px solid #dbe2ea;border-radius:10px;outline:none}.field input:focus{border-color:#1877f2}.primary{width:100%;padding:13px;background:#1877f2;color:#fff;border-radius:10px;font-weight:700;margin-top:8px}.secondary{background:#eef4ff;color:#1877f2;padding:10px 14px;border-radius:10px}.danger{background:#fee2e2;color:#dc2626;padding:10px 14px;border-radius:10px}.muted{color:#64748b;font-size:14px}.forgot{display:block;text-align:center;margin:14px;color:#1877f2;background:none}.error{background:#fee2e2;color:#b91c1c;padding:10px;border-radius:9px;font-size:13px;display:none}.success{background:#dcfce7;color:#166534;padding:10px;border-radius:9px;font-size:13px;display:none}.profileHead{display:flex;gap:18px;align-items:center;border-bottom:1px solid #eee;padding-bottom:20px}.avatar{width:76px;height:76px;border-radius:50%;background:#1877f2;color:#fff;display:grid;place-items:center;font-size:28px;font-weight:800}.name{font-size:23px;font-weight:800}.email{color:#64748b;margin-top:4px}.grid{display:grid;grid-template-columns:230px 1fr;gap:20px;margin-top:20px}.side button{display:block;width:100%;text-align:left;padding:12px 14px;background:#fff;border-radius:10px;margin-bottom:7px;color:#334155}.side button.active{background:#eaf2ff;color:#1877f2;font-weight:700}.panel{background:#fff;border-radius:16px;padding:20px;min-height:300px}.order{border:1px solid #e5e7eb;border-radius:12px;padding:14px;margin:10px 0}.badge{display:inline-block;padding:5px 9px;border-radius:20px;background:#fff7ed;color:#c2410c;font-size:12px;font-weight:700}.hidden{display:none!important}@media(max-width:700px){.grid{grid-template-columns:1fr}.side{display:flex;overflow:auto;gap:7px}.side button{min-width:max-content;margin:0}.profileHead{align-items:flex-start}.wrap{margin-top:15px}}
</style>
</head>
<body>
<header class="top"><button class="back" onclick="location.href='index.html'">← Home</button><div class="logo">Monoranjon Official</div></header>
<main class="wrap">
<section id="authBox" class="auth">
<h1 id="authTitle">Login</h1><p class="muted" id="authSubtitle">আপনার অ্যাকাউন্টে লগইন করুন</p>
<div class="tabs"><button id="loginTab" class="active" onclick="showLogin()">Login</button><button id="registerTab" onclick="showRegister()">Register</button></div>
<div id="messageError" class="error"></div><div id="messageSuccess" class="success"></div>
<form id="authForm">
<div id="nameField" class="field hidden"><label>আপনার নাম</label><input id="name" type="text" autocomplete="name" placeholder="আপনার নাম"></div>
<div class="field"><label>Email</label><input id="email" type="email" autocomplete="email" placeholder="example@gmail.com" required></div>
<div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password" placeholder="কমপক্ষে 6 অক্ষর" required></div>
<button class="primary" id="submitBtn" type="submit">Login</button>
</form>
<button class="forgot" id="forgotBtn" onclick="resetPassword()">Forgot password?</button>
</section>
<section id="profileBox" class="hidden">
<div class="profile"><div class="profileHead"><div class="avatar" id="avatar">M</div><div><div class="name" id="profileName">User</div><div class="email" id="profileEmail"></div></div><div style="margin-left:auto"><button class="danger" onclick="logout()">Logout</button></div></div></div>
<div class="grid"><nav class="side"><button class="active" onclick="panel('profile',this)">👤 Profile</button><button onclick="panel('orders',this)">📦 My Orders</button><button onclick="panel('cart',this)">🛒 Cart</button><button onclick="panel('wishlist',this)">❤️ Wishlist</button><button onclick="panel('settings',this)">⚙️ Settings</button></nav>
<section class="panel"><div id="profilePanel"><h2>Profile</h2><p class="muted">আপনার অ্যাকাউন্টের তথ্য</p><div class="field"><label>Name</label><input id="editName" type="text"></div><button class="secondary" onclick="saveProfile()">Save Profile</button></div>
<div id="ordersPanel" class="hidden"><h2>My Orders</h2><div id="ordersList"><p class="muted">Loading...</p></div></div>
<div id="cartPanel" class="hidden"><h2>Cart</h2><div id="cartList"></div></div>
<div id="wishlistPanel" class="hidden"><h2>Wishlist</h2><div id="wishList"></div></div>
<div id="settingsPanel" class="hidden"><h2>Settings</h2><p class="muted">Password পরিবর্তন করতে Forgot password ব্যবহার করতে পারেন।</p><button class="danger" onclick="logout()">Logout</button></div>
</section></div></section>
</main>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getAuth,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,sendPasswordResetEmail,signOut,updateProfile } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import { getFirestore,collection,query,where,getDocs,orderBy } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

const firebaseConfig={apiKey:'AIzaSyCkjYc5E2p69LsOasqmJSAm90KKjkjLKPw',authDomain:'monoranjon-pay.firebaseapp.com',databaseURL:'https://monoranjon-pay-default-rtdb.firebaseio.com',projectId:'monoranjon-pay',storageBucket:'monoranjon-pay.firebasestorage.app',messagingSenderId:'618952154005',appId:'1:618952154005:web:e26b8375af4c06c45b349c'};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
let mode='login';
const $=id=>document.getElementById(id);
function msg(type,text){$('messageError').style.display=type==='error'?'block':'none';$('messageSuccess').style.display=type==='success'?'block':'none';$(type==='error'?'messageError':'messageSuccess').textContent=text}
window.showLogin=()=>{mode='login';$('authTitle').textContent='Login';$('authSubtitle').textContent='আপনার অ্যাকাউন্টে লগইন করুন';$('loginTab').classList.add('active');$('registerTab').classList.remove('active');$('nameField').classList.add('hidden');$('submitBtn').textContent='Login';$('forgotBtn').classList.remove('hidden');msg('success','')};
window.showRegister=()=>{mode='register';$('authTitle').textContent='Create Account';$('authSubtitle').textContent='নতুন অ্যাকাউন্ট তৈরি করুন';$('registerTab').classList.add('active');$('loginTab').classList.remove('active');$('nameField').classList.remove('hidden');$('submitBtn').textContent='Register';$('forgotBtn').classList.add('hidden');msg('success','')};
$('authForm').addEventListener('submit',async e=>{e.preventDefault();msg('success','');msg('error','');const email=$('email').value.trim(),password=$('password').value;try{if(mode==='login'){await signInWithEmailAndPassword(auth,email,password)}else{const name=$('name').value.trim();if(!name)throw new Error('আপনার নাম লিখুন।');if(password.length<6)throw new Error('Password কমপক্ষে 6 অক্ষরের হতে হবে।');const cred=await createUserWithEmailAndPassword(auth,email,password);await updateProfile(cred.user,{displayName:name});} }catch(err){msg('error',friendlyError(err))}});
window.resetPassword=async()=>{const email=$('email').value.trim();if(!email)return msg('error','আগে আপনার Email লিখুন।');try{await sendPasswordResetEmail(auth,email);msg('success','Password reset link আপনার Email-এ পাঠানো হয়েছে।')}catch(err){msg('error',friendlyError(err))}};
window.logout=async()=>{await signOut(auth);location.href='account.html'};
function friendlyError(e){const c=e?.code||'';const map={'auth/invalid-credential':'Email অথবা Password ভুল।','auth/user-not-found':'এই Email দিয়ে কোনো account পাওয়া যায়নি।','auth/wrong-password':'Password ভুল।','auth/email-already-in-use':'এই Email দিয়ে আগে থেকেই account আছে।','auth/invalid-email':'সঠিক Email লিখুন।','auth/weak-password':'Password আরও শক্ত করুন; কমপক্ষে 6 অক্ষর দিন।','auth/too-many-requests':'অনেকবার চেষ্টা হয়েছে। কিছুক্ষণ পরে আবার চেষ্টা করুন।','auth/api-key-not-valid.-please-pass-a-valid-api-key.':'Firebase API key/config সমস্যা হয়েছে।'};return map[c]||e.message||'কাজটি সম্পন্ন করা যায়নি।';}
onAuthStateChanged(auth,async user=>{if(user){$('authBox').classList.add('hidden');$('profileBox').classList.remove('hidden');$('profileName').textContent=user.displayName||'User';$('profileEmail').textContent=user.email||'';$('editName').value=user.displayName||'';$('avatar').textContent=(user.displayName||user.email||'U')[0].toUpperCase();loadOrders(user.uid);loadLocal();}else{$('authBox').classList.remove('hidden');$('profileBox').classList.add('hidden')}});
async function loadOrders(uid){try{const q=query(collection(db,'payments'),where('userId','==',uid));const snap=await getDocs(q);const arr=[];snap.forEach(d=>arr.push(d.data()));arr.sort((a,b)=>String(b.createdAtClient||'').localeCompare(String(a.createdAtClient||'')));$('ordersList').innerHTML=arr.length?arr.map(o=>`<div class="order"><b>${esc(o.productName||'Product')}</b><br><span class="muted">Order: ${esc(o.orderId||'-')} · ${esc(o.amount||0)} BDT</span><br><span class="badge">${esc(o.status||'pending')}</span></div>`).join(''):'<p class="muted">এখনও কোনো order নেই।</p>'}catch(e){$('ordersList').innerHTML='<p class="muted">Orders load করা যায়নি।</p>'}}
window.saveProfile=async()=>{const name=$('editName').value.trim();if(!name)return;try{await updateProfile(auth.currentUser,{displayName:name});$('profileName').textContent=name;$('avatar').textContent=name[0].toUpperCase();alert('Profile updated successfully.')}catch(e){alert(friendlyError(e))}};
window.panel=(id,btn)=>{['profile','orders','cart','wishlist','settings'].forEach(x=>$(x+'Panel').classList.add('hidden'));$(id+'Panel').classList.remove('hidden');document.querySelectorAll('.side button').forEach(b=>b.classList.remove('active'));btn.classList.add('active');};
function loadLocal(){const cart=JSON.parse(localStorage.getItem('monoranjon_cart')||'[]');$('cartList').innerHTML=cart.length?cart.map(x=>`<div class="order"><b>${esc(x.name||x.productName||'Product')}</b><br>${esc(x.price||0)} BDT</div>`).join(''):'<p class="muted">Cart খালি।</p>';const wish=JSON.parse(localStorage.getItem('monoranjon_wishlist')||'[]');$('wishList').innerHTML=wish.length?wish.map(x=>`<div class="order"><b>${esc(x.name||x.productName||'Product')}</b><br>${esc(x.price||0)} BDT</div>`).join(''):'<p class="muted">Wishlist খালি।</p>'}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
</script>
</body></html>
